# 03-role.yaml
# A Role defines WHAT actions are allowed on WHICH resources
# This role ONLY works within the 'devsecops-demo' namespace
# It follows the Principle of Least Privilege — only get/list pods and services

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-role
  namespace: devsecops-demo
rules:
  # Rule 1: Allow reading pods (get, list, watch)
  - apiGroups: [""]            # "" means core API group (pods, services, etc.)
    resources: ["pods"]        # Which resource type
    verbs: ["get", "list", "watch"]  # What actions are allowed

  # Rule 2: Allow reading services
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]

  # Rule 3: Allow reading configmaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]

  # ❌ NOT allowed: create, update, delete, patch
  # ❌ NOT allowed: deployments, secrets, nodes
