# 02-serviceaccount.yaml
# A ServiceAccount gives an identity to pods running in the cluster
# Instead of using the default SA (which may have too many permissions),
# create a dedicated SA for each application

apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  namespace: devsecops-demo
  labels:
    app: devsecops-demo
# automountServiceAccountToken: false  ← Uncomment to disable auto-mounting the token
# This prevents pods from automatically getting API access to the cluster
