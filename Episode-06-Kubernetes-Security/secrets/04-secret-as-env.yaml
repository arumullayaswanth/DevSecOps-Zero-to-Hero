# 04-secret-as-env.yaml
# Inject secrets as environment variables into the container
# The app reads DB_USERNAME and DB_PASSWORD from environment
#
# Pros: Simple, works with most apps
# Cons: Env vars can leak in logs, crash dumps, and /proc/environ
# Recommendation: Prefer volume mounts (03-pod-with-secret.yaml) over env vars

apiVersion: v1
kind: Pod
metadata:
  name: secret-env-pod
  namespace: devsecops-demo
  labels:
    app: secret-env-demo
spec:
  serviceAccountName: app-service-account
  automountServiceAccountToken: false

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: app
      image: alpine:3.19
      command: ["sleep", "3600"]

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

      # Inject individual secret keys as environment variables
      env:
        # DB_USERNAME env var = value of 'db-username' key from app-secrets
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets # Secret name from 01-secret-opaque.yaml
              key: db-username # Key within the secret

        # DB_PASSWORD env var = value of 'db-password' key from app-secrets
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: db-password

        # DB_CONNECTION_STRING env var
        - name: DB_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: db-connection-string

      resources:
        limits:
          memory: "64Mi"
          cpu: "100m"
