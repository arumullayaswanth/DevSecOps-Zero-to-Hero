# 03-pod-with-secret.yaml
# Mount secrets as files inside the pod
# Secrets are mounted at /etc/secrets/ as individual files
# Each key in the secret becomes a file name, value becomes file content
#
# Example:
#   /etc/secrets/db-password  → contains "my_secret_password"
#   /etc/secrets/db-username  → contains "admin"

apiVersion: v1
kind: Pod
metadata:
  name: secret-demo-pod
  namespace: devsecops-demo
  labels:
    app: secret-demo
spec:
  serviceAccountName: app-service-account
  automountServiceAccountToken: false

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: app
      image: alpine:3.19
      command: ["sleep", "3600"]

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

      # Mount the secret as files
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/secrets
          readOnly: true # Secret files are read-only (important!)

      resources:
        limits:
          memory: "64Mi"
          cpu: "100m"

  volumes:
    - name: secret-volume
      secret:
        secretName: app-secrets # References 01-secret-opaque.yaml
        # Optional: Set specific file permissions
        defaultMode: 0400 # Read-only for owner only
