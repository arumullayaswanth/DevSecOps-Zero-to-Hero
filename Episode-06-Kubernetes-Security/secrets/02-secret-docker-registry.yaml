# 02-secret-docker-registry.yaml
# Docker registry secret — used to pull images from private registries
# Kubernetes uses this to authenticate with Docker Hub, ECR, GCR, etc.
#
# Alternative command to create this secret:
# kubectl create secret docker-registry my-registry-secret \
#   --docker-server=https://index.docker.io/v1/ \
#   --docker-username=yaswanth \
#   --docker-password=your-token \
#   --docker-email=yaswanth@example.com \
#   -n devsecops-demo

apiVersion: v1
kind: Secret
metadata:
  name: my-registry-secret
  namespace: devsecops-demo
type: kubernetes.io/dockerconfigjson
data:
  # This is base64 encoded docker config JSON
  # In real use, generate with: kubectl create secret docker-registry ...
  # Then export: kubectl get secret my-registry-secret -o yaml
  .dockerconfigjson: eyJhdXRocyI6eyJodHRwczovL2luZGV4LmRvY2tlci5pby92MS8iOnsidXNlcm5hbWUiOiJ5YXN3YW50aCIsInBhc3N3b3JkIjoiZHVtbXktdG9rZW4iLCJlbWFpbCI6Inlhc3dhbnRoQGV4YW1wbGUuY29tIiwiYXV0aCI6ImVXRnpkMkZ1ZEdnNlpIVnRiWGt0ZEc5clpXND0ifX19
