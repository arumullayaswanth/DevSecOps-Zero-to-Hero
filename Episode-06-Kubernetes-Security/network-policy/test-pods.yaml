# test-pods.yaml
# Test pods + services for verifying network policies
# These pods comply with "restricted" Pod Security Standards
# Services are needed so pods can find each other by name (DNS)

---
# Frontend test pod
apiVersion: v1
kind: Pod
metadata:
  name: test-frontend
  namespace: devsecops-demo
  labels:
    app: frontend
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: alpine:3.19
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          memory: "64Mi"
          cpu: "100m"

---
# Backend test pod
apiVersion: v1
kind: Pod
metadata:
  name: test-backend
  namespace: devsecops-demo
  labels:
    app: backend
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: python:3.11-alpine
      # Run a simple HTTP server on port 8080
      command: ["python3", "-m", "http.server", "8080"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          memory: "64Mi"
          cpu: "100m"

---
# Database test pod
apiVersion: v1
kind: Pod
metadata:
  name: test-database
  namespace: devsecops-demo
  labels:
    app: database
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: python:3.11-alpine
      # Run a simple HTTP server on port 5432
      command: ["python3", "-m", "http.server", "5432"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          memory: "64Mi"
          cpu: "100m"

---
# Service for backend (so frontend can reach it by name "test-backend")
apiVersion: v1
kind: Service
metadata:
  name: test-backend
  namespace: devsecops-demo
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080

---
# Service for database (so backend can reach it by name "test-database")
apiVersion: v1
kind: Service
metadata:
  name: test-database
  namespace: devsecops-demo
spec:
  selector:
    app: database
  ports:
    - port: 5432
      targetPort: 5432
